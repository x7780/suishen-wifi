name: suishen-wifi 内容维护

on:
  workflow_dispatch:
  schedule:
    # 每周一、三、五 UTC 02:00（北京时间 10:00）自动运行
    - cron: '0 2 * * 1,3,5'

jobs:
  content-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup binary permissions
        run: chmod +x Ai_Agent/picoclaw/picoclaw-launcher Ai_Agent/picoclaw/picoclaw

      - name: Setup config
        run: |
          mkdir -p ~/.picoclaw
          cp Ai_Agent/Agent_suishen-wifi/config.json ~/.picoclaw/config.json
          cp -r Ai_Agent/Agent_suishen-wifi/workspace ~/.picoclaw/workspace
          mkdir -p ~/.picoclaw/workspace/memory

      - name: Verify secrets loaded
        env:
          PICO_TOKEN: ${{ secrets.PICO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: |
          echo "========== Secrets Verification =========="
          echo "PICO_TOKEN: $(if [ -n "$PICO_TOKEN" ]; then echo "✅ Loaded (length: ${#PICO_TOKEN})"; else echo "❌ NOT SET"; fi)"
          echo "TELEGRAM_BOT_TOKEN: $(if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "✅ Loaded (length: ${#TELEGRAM_BOT_TOKEN})"; else echo "❌ NOT SET"; fi)"
          echo "DOUBAO_API_KEY: $(if [ -n "$DOUBAO_API_KEY" ]; then echo "✅ Loaded (length: ${#DOUBAO_API_KEY})"; else echo "❌ NOT SET"; fi)"
          echo "========================================="

      - name: Generate security config from secrets
        env:
          PICO_TOKEN: ${{ secrets.PICO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: |
          cat > ~/.picoclaw/.security.yml << 'EOF'
          channel_list:
            dingtalk:
              settings: {}
            discord:
              settings: {}
            feishu:
              settings: {}
            irc:
              settings: {}
            line:
              settings: {}
            maixcam:
              settings: {}
            matrix:
              settings: {}
            onebot:
              settings: {}
            pico:
              settings:
                token: ${PICO_TOKEN}
            qq:
              settings: {}
            slack:
              settings: {}
            telegram:
              settings:
                token: ${TELEGRAM_BOT_TOKEN}
            wecom:
              settings: {}
            weixin:
              settings: {}
            whatsapp:
              settings: {}

          model_list:
            LongCat-Flash-Thinking:0: {}
            MiniMax-M2.5:0: {}
            ark-code-latest:0: {}
            azure-gpt5:0: {}
            cerebras-llama-3.3-70b:0: {}
            claude-sonnet-4.6:0: {}
            copilot-gpt-5.4:0: {}
            deepseek-chat:0: {}
            deepseek-v3.2:0: {}
            deepseek-v3:0: {}
            doubao-pro:0:
              api_keys:
                - ${DOUBAO_API_KEY}
            gemini-2.0-flash:0: {}
            gemini-flash:0: {}
            glm-4.7:0: {}
            gpt-5.4:0: {}
            kimi-k2.5:0: {}
            llama-3.3-70b:0: {}
            llama3:0: {}
            lmstudio-local:0: {}
            local-model:0: {}
            mistral-small:0: {}
            modelscope-qwen:0: {}
            moonshot-v1-8k:0: {}
            nemotron-4-340b:0: {}
            openrouter-auto:0: {}
            openrouter-gpt-5.4:0: {}
            qwen-plus:0: {}
            venice-uncensored:0: {}
            vivgrid-auto:0: {}

          web:
            brave: {}
            tavily: {}
            perplexity: {}
            glm_search: {}
            baidu_search: {}

          skills:
            registries: {}
          EOF
          echo "✅ Security config generated from individual secrets"

      - name: Setup git for publisher agent
        run: |
          git config --global user.name "suishen-wifi Bot"
          git config --global user.email "bot@suishen-wifi"

      - name: Run PicoClaw Gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 后台启动 gateway
          PICOCLAW_HOME=~/.picoclaw PICOCLAW_LOG_LEVEL=info ./Ai_Agent/picoclaw/picoclaw gateway &
          PID=$!
          echo "Gateway started with PID: $PID"

          # 等待 heartbeat 执行和写作任务（15分钟足够）
          echo "Waiting 15 minutes for writing task to complete..."
          sleep 900

          # 优雅停止 gateway
          echo "Stopping gateway..."
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Gateway stopped"

      - name: Save generated articles and images
        if: always()
        run: |
          # 保存生成的文章
          if [ -d ~/.picoclaw/workspace/article ]; then
            mkdir -p Ai_Agent/Agent_suishen-wifi/workspace/article
            cp -r ~/.picoclaw/workspace/article/* Ai_Agent/Agent_suishen-wifi/workspace/article/ 2>/dev/null || true
            echo "✅ Articles saved to Ai_Agent/Agent_suishen-wifi/workspace/article/"
          fi

          # 保存 memory
          cp ~/.picoclaw/workspace/memory/MEMORY.md Ai_Agent/Agent_suishen-wifi/workspace/memory/MEMORY.md 2>/dev/null || true

          # 配置 git
          git config user.name "suishen-wifi Bot"
          git config user.email "bot@suishen-wifi"

          # 添加所有变更的文件
          git add Ai_Agent/Agent_suishen-wifi/workspace/article/ 2>/dev/null || true
          git add Ai_Agent/Agent_suishen-wifi/workspace/memory/MEMORY.md 2>/dev/null || true

          # 提交并推送（先拉取最新代码避免冲突）
          git diff --staged --quiet || git commit -m "Auto-save: Articles and memory [$(date '+%Y-%m-%d %H:%M')]"
          git stash || true
          git pull --rebase origin main || true
          git stash pop || true
          git push
